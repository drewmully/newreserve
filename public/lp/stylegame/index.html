<style>
/* ---------- Brand tokens: edit these to match mymully.com exactly ---------- */
:root{
  --paper:#F6F4EE;        /* page surface */
  --paper-2:#EDEAE1;      /* cards, chips */
  --ink:#141816;          /* text */
  --ink-2:#5C625D;        /* secondary text */
  --line:#D6D2C6;         /* hairlines */
  --green:#1F4A3A;        /* Mully fairway green, primary action */
  --green-2:#2C6650;      /* hover */
  --brass:#A98A4E;        /* the "reading" signal */
  --white:#FFFFFF;
  --display:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
  --ease:cubic-bezier(.22,.8,.26,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

/* ---------- Frame ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 6px;min-height:52px}
.wordmark{font-family:var(--display);font-size:22px;letter-spacing:-.01em}
.wordmark i{font-style:normal;color:var(--green)}
#progress{height:2px;background:var(--line);margin:0 20px;border-radius:2px;overflow:hidden;opacity:0;transition:opacity .4s}
#progress b{display:block;height:100%;width:0;background:var(--green);transition:width .6s var(--ease)}
#stage{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;padding:14px 20px 24px;display:flex;flex-direction:column;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  opacity:0;transform:translateY(14px);transition:opacity .38s var(--ease),transform .38s var(--ease)}
.screen.in{opacity:1;transform:none}
.screen.out{opacity:0;transform:translateY(-14px)}
.screen .grow{flex:1}

/* ---------- Reading pill: the signature ---------- */
#pill{position:absolute;right:20px;top:14px;display:inline-flex;align-items:center;gap:8px;
  padding:6px 11px 6px 8px;border:1px solid var(--line);border-radius:99px;background:var(--white);
  font-size:12px;color:var(--ink-2);opacity:0;transform:translateY(-6px);transition:.4s var(--ease);z-index:5}
#pill.show{opacity:1;transform:none}
#pill .dot{width:7px;height:7px;border-radius:50%;background:var(--brass);animation:breathe 2.2s infinite}
#pill b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
#pill.tick .dot{animation:pop .5s var(--ease)}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.9)}100%{transform:scale(1)}}

/* ---------- Type ---------- */
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,46px);line-height:1.05;letter-spacing:-.02em}
h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,7vw,32px);line-height:1.12;letter-spacing:-.015em;margin-bottom:6px}
.sub{color:var(--ink-2);font-size:15px;margin-bottom:0}
.muted{color:var(--ink-2)}
.small{font-size:13px}

/* ---------- Controls ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:14px 20px;
  border-radius:var(--r);background:var(--green);color:var(--white);font-weight:600;font-size:17px;
  transition:transform .15s var(--ease),background .2s}
.btn:active{transform:scale(.985)}
.btn:hover{background:var(--green-2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--paper-2)}
.btn[disabled]{opacity:.4;pointer-events:none}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;min-height:64px;
  border-radius:var(--r);background:var(--white);border:1px solid var(--line);
  transition:transform .15s var(--ease),border-color .2s,background .2s}
.opt:active{transform:scale(.985)}
.opt:hover{border-color:var(--ink-2)}
.opt.sel{border-color:var(--green);background:#EEF3EF}
.opt .t{font-weight:600}
.opt .d{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.opt .k{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;
  font-size:12px;color:var(--ink-2);flex:none;font-family:var(--mono)}
.opt.sel .k{background:var(--green);color:var(--white);border-color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 12px 14px;text-align:center;
  border-radius:var(--r);background:var(--white);border:1px solid var(--line);transition:transform .15s var(--ease),border-color .2s}
.tile:active{transform:scale(.97)}
.tile.sel{border-color:var(--green);background:#EEF3EF}
.tile svg{width:64px;height:64px}
.tile .t{font-weight:600;font-size:15px}
.tile .d{font-size:12px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 16px;border-radius:99px;background:var(--white);border:1px solid var(--line);font-size:15px;transition:.15s}
.chip.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:active{transform:scale(.96)}
.row{display:flex;gap:10px;align-items:center}
.foot{display:flex;gap:10px;align-items:center}
.foot .btn{flex:1}
.skip{align-self:center;padding:14px;color:var(--ink-2);font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* ---------- Landing ---------- */
.landing h1 .cur{display:inline-block;width:.06em;height:.95em;background:var(--green);vertical-align:-.12em;margin-left:.08em;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.ticker{margin-top:auto;padding-top:26px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);height:52px;overflow:hidden;position:relative}
.ticker div{position:absolute;inset:26px 0 0;opacity:0;transform:translateY(8px);transition:.5s var(--ease)}
.ticker div.on{opacity:1;transform:none}
.ticker b{color:var(--ink);font-weight:600}
.trust{display:flex;gap:18px;margin-top:14px;font-size:12px;color:var(--ink-2)}
.trust span::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--brass);margin-right:7px;vertical-align:middle}

/* ---------- Game 1: Split-second ---------- */
.timer{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
.timer b{display:block;height:100%;width:100%;background:var(--brass);transform-origin:left;transition:none}
.timer.run b{transition:transform linear;transform:scaleX(0)}
.timer.late b{background:#B4463C;transform:scaleX(1)!important;transition:transform .2s,background .2s}
.counter.late,.count.late{color:#B4463C}
.hint{font-size:13px;color:#B4463C;min-height:1.3em;margin-top:6px;opacity:0;transition:opacity .25s}
.hint.on{opacity:1}
.streak{color:var(--brass);font-weight:600}
#react{position:absolute;right:20px;top:52px;font-family:var(--display);font-size:18px;color:var(--ink);opacity:0;transform:translateY(4px);transition:.25s var(--ease);pointer-events:none;z-index:6}
#react.on{opacity:1;transform:none}
.call{display:flex;gap:6px;margin:0 0 12px}
.call button{flex:1;padding:9px 4px;border-radius:99px;border:1px solid var(--line);background:var(--white);font-size:13px}
.call button.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rare{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:99px;background:var(--brass);color:var(--white);font-size:10px;letter-spacing:.08em;text-transform:uppercase;vertical-align:middle}
.near{font-size:13px;color:var(--ink-2);margin-top:10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:min(62vh,520px)}
.pair button{border-radius:18px;border:1px solid var(--line);background:var(--white);display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:clamp(28px,8vw,40px);letter-spacing:-.01em;min-height:0;height:100%;overflow:hidden;position:relative;
  transition:transform .12s var(--ease)}
.pair button:active{transform:scale(.96)}
.pair .sw{position:absolute;inset:0}
.pair .tx{position:absolute;inset:0}
.pair .tx.dots{background-image:radial-gradient(var(--ink) 3.2px,transparent 3.5px);background-size:22px 22px;background-position:6px 6px}
.pair .tx.grid{background-image:linear-gradient(var(--ink) 2px,transparent 2px),linear-gradient(90deg,var(--ink) 2px,transparent 2px);background-size:22px 22px;background-position:-1px -1px}
.pair .shape{width:50%;height:50%;display:flex;align-items:center;justify-content:center}
.pair .shape svg{display:block;width:100%;height:100%}
.counter{font-family:var(--mono);font-size:12px;color:var(--ink-2)}

/* ---------- Slider ---------- */
.swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0 14px}
.swatches i{display:block;aspect-ratio:1;border-radius:10px;border:1px solid rgba(0,0,0,.06);transition:transform .25s var(--ease)}
.swatches i.on{transform:scale(1.12);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--green)}
input[type=range]{width:100%;appearance:none;height:2px;background:var(--line);margin:18px 0 8px}
input[type=range]::-webkit-slider-thumb{appearance:none;width:30px;height:30px;border-radius:50%;background:var(--green);border:4px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--green);border:4px solid var(--paper)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.read{margin-top:18px;padding:14px 16px;background:var(--white);border:1px solid var(--line);border-radius:var(--r);font-size:15px;min-height:70px}

/* ---------- Fit morph ---------- */
.fitfig{display:grid;place-items:center;margin:0 0 12px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--white);width:100%}
.fitfig svg{width:110px;height:130px}
.fitfig path{transition:d .45s var(--ease)}

/* ---------- Foursome ---------- */
.four{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.partner{padding:12px;border-radius:var(--r);background:var(--white);border:1px solid var(--line);text-align:left;transition:.15s}
.partner .n{font-family:var(--display);font-size:19px}
.partner .d{font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.35}
.partner .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;min-height:18px}
.partner .tags span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--paper-2);color:var(--ink)}
.partner.hot{border-color:var(--green)}
.ask{font-size:15px;padding:12px 16px;border-radius:var(--r);background:var(--ink);color:var(--paper);display:flex;justify-content:space-between;align-items:center}
.ask b{font-family:var(--display);font-weight:400;font-size:18px}
.ask span{font-family:var(--mono);font-size:11px;opacity:.7}

/* ---------- Pack the bag ---------- */
.bag{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.bag .opt{min-height:56px;padding:12px 14px}
.bag .opt .t{font-size:15px}
.count{font-family:var(--mono);font-size:12px;color:var(--ink-2)}

/* ---------- Sizing ---------- */
.sizes{display:flex;flex-direction:column;gap:14px}
.sizes label{font-size:13px;color:var(--ink-2);display:block;margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:52px;padding:11px 8px;border-radius:10px;background:var(--white);border:1px solid var(--line);font-size:14px}
.seg button.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------- Interstitial ---------- */
.inter{justify-content:center;text-align:center}
.inter p{font-family:var(--display);font-size:clamp(22px,6vw,28px);line-height:1.25;letter-spacing:-.01em;max-width:24ch;margin:0 auto}
.inter .from{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);margin-top:16px}
.inter .stat{font-family:var(--mono);font-size:13px;color:var(--ink-2);margin-bottom:14px}

/* ---------- Finale ---------- */
.finale{justify-content:center;align-items:center;text-align:center;overflow:hidden}
.assembly{position:relative;width:min(300px,78vw);aspect-ratio:3/4;margin:10px auto}
.assembly .piece{position:absolute;opacity:0;transform:translate(var(--x,0),var(--y,0)) scale(.7);transition:transform 1s var(--ease),opacity .6s}
.assembly.go .piece{opacity:1;transform:none}
.assembly .sw{width:64px;height:64px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.assembly .fig{width:120px;height:140px;left:50%;top:32%;margin-left:-60px}
.assembly .mark{font-family:var(--display);font-size:16px;color:var(--ink);padding:6px 10px;background:var(--white);border:1px solid var(--line);border-radius:8px;white-space:nowrap}
.assembly .card{position:absolute;inset:0;border-radius:22px;background:var(--white);border:1px solid var(--line);opacity:0;transform:scale(.92);transition:opacity .6s .2s,transform .8s var(--ease)}
.assembly.card-on .piece{opacity:0;transform:scale(.6);transition:transform .6s var(--ease),opacity .4s}
.assembly.card-on .card{opacity:1;transform:none}
.assembly .card::after{content:"";position:absolute;inset:0;border-radius:22px;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%);transform:translateX(-120%);}
.assembly.card-on .card::after{animation:shine 1.2s .5s var(--ease) forwards}
@keyframes shine{to{transform:translateX(120%)}}
.assembly .card .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
.assembly .card .name{font-family:var(--display);font-size:26px;letter-spacing:-.02em;min-height:1.2em}
.assembly .card .pal{display:flex;gap:6px}
.assembly .card .pal i{width:22px;height:22px;border-radius:6px}
.status{font-family:var(--mono);font-size:12px;color:var(--ink-2);min-height:1.4em;margin-top:6px}

/* ---------- Profile ---------- */
.profile{padding-top:6px;display:flex;flex-direction:column;min-height:100%}
.sc{position:relative;flex:none;display:flex;flex-direction:column;border-radius:24px;padding:18px 18px 16px;overflow:hidden;box-shadow:0 20px 50px rgba(20,24,22,.14)}
.sc .top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.sc .top .wm{font-family:var(--display);font-size:18px;letter-spacing:0;text-transform:none;opacity:1}
.sc .big{margin:14px 0 0}
.sc .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin-bottom:6px}
.sc h1{font-size:clamp(30px,9.5vw,44px);line-height:.98;margin-bottom:6px}
.sc .tagl{font-size:14px;opacity:.85}
.sc .bars.sb{margin:14px 0 4px;gap:6px}
.sc .bars.sb .bar{color:inherit}
.sc .bars.sb .bar i{background:rgba(127,127,127,.25)}
.sc .bars.sb .bar i b{background:currentColor}
.sc .bars.sb .bar span:last-child{color:inherit;opacity:.8}
.sc .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0 0}
.sc .stat{padding:10px 10px 9px;border-radius:14px;background:rgba(255,255,255,.16);backdrop-filter:blur(2px)}
.sc .stat.ink{background:rgba(20,24,22,.08)}
.sc .stat b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(22px,6.5vw,28px);line-height:1;letter-spacing:-.02em}
.sc .stat span{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-top:5px}
.sc .super{font-family:var(--display);font-size:17px;margin-top:14px;line-height:1.25}
.sc .strip{display:flex;gap:6px;margin-top:14px}
.sc .strip i{flex:1;height:10px;border-radius:5px;border:1px solid rgba(255,255,255,.35)}
.sc .aw{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;padding-bottom:2px}
.sc .aw span{font-size:11px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.18)}
.sc .aw.ink span{background:rgba(20,24,22,.08)}
.ctablock{position:sticky;bottom:0;margin:0 -20px;padding:12px 20px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 22%);z-index:4}
.ctas{display:flex;gap:8px;padding-top:0}
.ctas .btn.hero{min-height:64px;font-size:17px;white-space:nowrap;box-shadow:0 12px 28px rgba(31,74,58,.35);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 12px 28px rgba(31,74,58,.35)}50%{box-shadow:0 14px 36px rgba(31,74,58,.55)}}
.ctas .btn{flex:1}
.ctas .ico{flex:none;width:56px;padding:0}
.nextup{font-size:13px;line-height:1.45;color:var(--ink);text-align:center;padding:10px 6px 0}
.more{text-align:center;color:var(--ink-2);font-size:12px;padding:16px 0 6px;letter-spacing:.08em;text-transform:uppercase}
.more::after{content:"";display:block;width:8px;height:8px;border-right:1.5px solid var(--ink-2);border-bottom:1.5px solid var(--ink-2);transform:rotate(45deg);margin:6px auto 0}
.pcard{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:14px}
.pcard .eyebrow{margin-bottom:8px}
.pcard h2{margin-bottom:4px}
.pcard .tag{color:var(--ink-2);font-size:15px;margin-bottom:16px}
.bars{display:flex;flex-direction:column;gap:7px;margin:14px 0}
.bar{display:grid;grid-template-columns:64px 1fr 36px;align-items:center;gap:10px;font-size:12px}
.bar i{display:block;height:6px;border-radius:3px;background:var(--paper-2);overflow:hidden}
.bar i b{display:block;height:100%;width:0;background:var(--green);transition:width 1s var(--ease)}
.bar span:last-child{text-align:right;font-family:var(--mono);color:var(--ink-2)}
.pal{display:flex;gap:8px;margin:14px 0 4px}
.pal i{flex:1;aspect-ratio:1;border-radius:10px;border:1px solid rgba(0,0,0,.06)}
.pal-l{display:flex;gap:8px;font-size:11px;color:var(--ink-2)}
.pal-l span{flex:1;text-align:center}
.readp{font-size:16px;line-height:1.55}
.edit{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--white);border:1px solid var(--line);border-radius:12px}
.item i{width:36px;height:36px;border-radius:9px;flex:none}
.item .b{font-size:12px;color:var(--ink-2)}
.item .p{font-weight:600;font-size:15px}
.item .w{margin-left:auto;font-size:11px;color:var(--brass);letter-spacing:.06em;text-transform:uppercase}
.price{font-size:13px;color:var(--ink-2);text-align:center;margin-top:12px}
.sticky{position:sticky;bottom:0;padding-top:14px;background:linear-gradient(transparent,var(--paper) 30%)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ---------- Module layout ---------- */
.mod{display:flex;flex-direction:column;min-height:100%}
.mod .m-head{margin-bottom:10px}
.mod .m-ctx{font-size:14px;color:var(--ink-2);margin:0 0 14px;padding:10px 12px;background:var(--paper-2);border-radius:10px}
.mod .m-game{flex:1;display:flex;flex-direction:column;min-height:0}
.mod .m-actions{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.mod .m-actions:empty{display:none}
.done{padding:12px 14px;border-radius:var(--r);background:var(--ink);color:var(--paper);font-size:14px}
.done b{font-family:var(--display);font-weight:400;font-size:18px;display:block;margin-bottom:2px}
.m-game.frozen{pointer-events:none;opacity:.45;transition:opacity .3s}
.m-game.locked{pointer-events:none}
.buckets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.bucket{min-height:84px;border:1.5px dashed var(--line);border-radius:12px;padding:8px 6px;text-align:center;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);transition:.15s}
.bucket b{display:block;font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);margin-top:8px;min-height:1.2em}
.bucket.over,.bucket.armed{border-color:var(--green);border-style:solid;background:#EEF3EF}
.partner{touch-action:none;user-select:none}
.partner.drag{position:relative;z-index:10;pointer-events:none;box-shadow:0 14px 30px rgba(20,24,22,.14);transition:none}
.partner.placed{opacity:.55}
.golfer.set .n{opacity:.85}
.mod .m-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);display:flex;gap:12px;align-items:flex-start}
.mod .m-foot .n{font-family:var(--mono);font-size:11px;flex:none;color:var(--brass);padding-top:2px}
.gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(246,244,238,.86);backdrop-filter:blur(3px);border-radius:18px;z-index:3}
.gate button{padding:16px 28px;border-radius:99px;background:var(--ink);color:var(--paper);font-weight:600;font-size:16px}
.m-game.rel{position:relative}
/* Swipe deck */
.deck{position:relative;flex:1;min-height:260px}
.cardx{position:absolute;inset:0;border-radius:20px;background:var(--white);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;text-align:center;touch-action:none;user-select:none;will-change:transform;box-shadow:0 12px 30px rgba(20,24,22,.06)}
.cardx{padding:0;overflow:hidden}
.cardx img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--paper-2)}
.cardx .lbl{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 16px;text-align:left;font-family:var(--display);font-size:22px;color:#fff;background:linear-gradient(transparent,rgba(20,24,22,.7))}
.cardx .t{font-family:var(--display);font-size:24px;letter-spacing:-.01em}
.cardx .d{font-size:13px;color:var(--ink-2)}
.cardx.snap{transition:transform .25s var(--ease)}
.cardx.fly{transition:transform .4s var(--ease),opacity .4s;opacity:0}
.cardx .yes,.cardx .no{position:absolute;top:18px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;padding:4px 8px;border:1.5px solid;border-radius:6px;opacity:0;transform:rotate(-8deg)}
.cardx .yes{right:18px;color:var(--green);border-color:var(--green)}
.cardx .no{left:18px;color:#B4463C;border-color:#B4463C;transform:rotate(8deg)}
.deckbtns{display:flex;gap:10px;margin-top:12px}
.deckbtns .btn{min-height:50px}
/* Week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week button{aspect-ratio:1/1.4;border-radius:12px;background:var(--white);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--ink-2)}
.week button b{font-family:var(--display);font-size:20px;color:var(--ink);font-weight:400}
.week button.sel{background:var(--green);border-color:var(--green)}
.week button.sel b,.week button.sel{color:var(--white)}
/* Word association */
.word{font-family:var(--display);font-size:clamp(36px,11vw,52px);letter-spacing:-.02em;text-align:center;padding:10px 0 22px;line-height:1.05}
.prompt{display:grid;place-items:center;height:130px;color:var(--ink);font-family:var(--display);font-size:clamp(38px,11vw,56px);letter-spacing:-.02em;opacity:0;transform:scale(.96);transition:.18s var(--ease)}
.prompt.in{opacity:1;transform:none}
.prompt svg{width:96px;height:96px}
.glyphs{display:grid;grid-template-columns:1fr;gap:10px;opacity:0;transform:translateY(6px);transition:.18s var(--ease)}
.glyphs.in{opacity:1;transform:none}
.wordopt{padding:20px 12px;border-radius:16px;background:var(--white);border:1px solid var(--line);font-family:var(--display);font-size:clamp(20px,5.6vw,26px);letter-spacing:-.01em;transition:transform .15s var(--ease),border-color .2s}
.wordopt:active{transform:scale(.97)}
.wordopt.sel{border-color:var(--green);background:#EEF3EF}
.glyph{aspect-ratio:1;display:grid;place-items:center;border-radius:18px;background:var(--white);border:1px solid var(--line);color:var(--ink);transition:transform .15s var(--ease),border-color .2s}
.glyph svg{width:58%;height:58%}
.glyph:active{transform:scale(.95)}
.glyph.sel{border-color:var(--green);background:#EEF3EF}
/* Odd one out */
.odd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.odd .tile{min-height:110px}
.checkpoint .big{font-family:var(--display);font-size:clamp(30px,8vw,40px);letter-spacing:-.02em;line-height:1.1;margin:10px 0 6px}

/* ---------- Card strip: the thing you're building, always visible ---------- */
#dots{display:flex;gap:6px}
#dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:.3s}
#dots i.on{background:var(--green)}
#dots i.now{background:var(--green);transform:scale(1.35)}
#cardstrip{display:flex;align-items:center;gap:5px;padding:6px 8px;border:1px solid var(--line);border-radius:99px;background:var(--white);font-size:12px;color:var(--ink-2);transition:.3s}
#cardstrip .slot{display:block;width:14px;height:14px;border-radius:4px;border:1px dashed var(--line);transition:.4s var(--ease)}
#cardstrip .slot.fig{width:10px;height:14px;border-radius:3px 3px 1px 1px}
#cardstrip .slot.on{border-style:solid;border-color:transparent}
#cardstrip .name{margin-left:4px;letter-spacing:.02em;filter:blur(0)}
#cardstrip .name.blur{filter:blur(3px);color:var(--ink)}
#cardstrip .n{margin-left:2px;padding:1px 7px;border-radius:99px;background:var(--paper-2);color:var(--ink);font-family:var(--mono);font-size:11px}
#cardstrip.tick .n{animation:pop .5s var(--ease)}
#giftbtn{font-size:12px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--white);color:var(--ink-2);transition:.2s}
#giftbtn.on{background:var(--brass);border-color:var(--brass);color:var(--white)}
#giftbtn.hide{display:none}
#back{display:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--white);color:var(--ink-2);font-size:15px;margin-right:2px}
#back.show{display:inline-grid;place-items:center}
#react{top:60px}
.fact{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,10px);padding:9px 14px;border-radius:99px;background:var(--white);border:1px solid var(--line);color:var(--ink-2);font-size:12px;white-space:nowrap;opacity:0;transition:.3s var(--ease);z-index:15;pointer-events:none;box-shadow:0 8px 24px rgba(20,24,22,.1)}
.fact.on{opacity:1;transform:translate(-50%,0)}
.fact b{color:var(--ink);font-weight:600}
.fact .e{margin-right:6px}
.fact.prize{background:var(--brass);color:var(--white);border-color:var(--brass);white-space:normal;max-width:calc(100% - 40px);text-align:center;line-height:1.35}
.fact.prize b{color:var(--white)}
.fact.prop{background:var(--ink);color:var(--paper);border-color:var(--ink);white-space:normal;max-width:calc(100% - 40px);text-align:center;line-height:1.35}
.fact.prop .wm{font-family:var(--display);font-size:13px;margin-right:8px;color:var(--brass)}
.toast{position:absolute;left:50%;top:70px;transform:translate(-50%,-10px);display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:99px;background:var(--ink);color:var(--paper);font-size:13px;opacity:0;transition:.35s var(--ease);z-index:20;pointer-events:none;box-shadow:0 10px 30px rgba(20,24,22,.2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .e{font-size:20px}
.toast b{display:block;font-weight:600;font-size:14px}
.awardrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.awardrow span{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--paper-2)}
#dots i.pop{animation:pop .5s var(--ease)}
/* swatch picker */
.pals2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pals2 .paltile{gap:8px;padding:10px;border-radius:20px}
.pals2 .paltile i{border-radius:12px}
.pals2 .paltile.sel{transform:scale(1.03)}
.pals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.paltile{aspect-ratio:1;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:4px;border-radius:12px;background:var(--white);border:1px solid var(--line);transition:transform .25s var(--ease),border-color .2s}
.paltile i{display:block;border-radius:5px}
.paltile.sel{transform:scale(1.15);border-color:var(--green);box-shadow:0 8px 20px rgba(20,24,22,.1)}
.swpick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.swpick button{aspect-ratio:1;border-radius:16px;border:1px solid rgba(0,0,0,.06);transition:transform .2s var(--ease)}

.swpick button.sel{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--green)}

/* fit tiles */
.mirror{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:min(240px,70vw);aspect-ratio:3/4;margin:6px auto 14px;border-radius:120px 120px 20px 20px;background:var(--white);border:1px solid var(--line);box-shadow:inset 0 0 40px rgba(20,24,22,.04)}

.mirror .pulse{position:absolute;width:56px;height:56px;border-radius:50%;border:2px solid var(--brass);opacity:0;animation:ring 1.6s .6s infinite}
.mirror.touched .pulse{animation:none;opacity:0}
@keyframes ring{0%{transform:scale(.5);opacity:.8}100%{transform:scale(1.8);opacity:0}}
.okbtn{display:block;width:64px;height:64px;margin:0 auto;border-radius:50%;background:var(--green);color:var(--white);font-size:26px}
.fits{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fits .tile svg{width:64px;height:88px}
/* FMK-style foursome */
.fmk{display:flex;flex-direction:column;gap:8px}
.golfer{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);background:var(--white);border:1px solid var(--line);transition:.2s}
.golfer .n{font-family:var(--display);font-size:18px;line-height:1.1}
.golfer .d{font-size:12px;color:var(--ink-2)}
.golfer .acts{margin-left:auto;display:flex;gap:4px;flex:none}
.golfer .acts button{padding:7px 9px;border-radius:8px;border:1px solid var(--line);font-size:12px;background:var(--paper)}
.golfer .acts button.used{opacity:.25;pointer-events:none}
.golfer .acts button.sel{background:var(--ink);color:var(--paper);border-color:var(--ink);opacity:1}
.golfer.set{border-color:var(--green)}
.golfer.set .acts button:not(.sel){display:none}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink-2);margin-bottom:10px}
.legend b{color:var(--ink);font-weight:600}
/* deposit */
.blank{font-style:normal;color:var(--green);border-bottom:2px solid var(--green);transition:.2s}
.ins{display:flex;flex-direction:column}
.ins>div{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.ins>div:first-child{border-top:0;padding-top:0}
.ins span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding-top:3px}
.ins b{font-weight:500;color:var(--ink)}
.val{display:flex;flex-direction:column;gap:9px;font-size:14px}
.val>div{display:flex;gap:10px;align-items:flex-start}
.val i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--brass);margin-top:7px}
.how{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}

.how b{display:block;font-family:var(--display);font-weight:400;font-size:22px;color:var(--brass);margin-bottom:2px}
.pcard .stylist{font-size:12px;color:var(--brass);letter-spacing:.06em;text-transform:uppercase;margin-top:8px}
</style>

function resolve(){ const L=leaders(); let key;

  const agree=Math.min(1,L.gap/(L.tot*.35)); const confidence=Math.round(60+38*(.6*agree+.4*Math.min(1,S.fastPicks/8)));
  const mix=S.v.map(x=>Math.max(0,x)),tot=mix.reduce((a,b)=>a+b,0)||1,pcts=mix.map(x=>Math.round(x/tot*100));

  return {key,P,confidence,pcts,L,extra:bits.join(' '),near,nearGap,rarity:MODEL.rarity[key]}; }

const lum=(hex)=>{const c=hex.replace('#','');const r=parseInt(c.slice(0,2),16)/255,g=parseInt(c.slice(2,4),16)/255,b=parseInt(c.slice(4,6),16)/255;return .2126*r+.7152*g+.0722*b;};

  return {bg,fg,light,oneIn,sup,stats:[[`1 in ${oneIn}`,'golfers'],[`${(S.awards||[]).length}`,'badges'],[`${R.L.pct}%`,AX[R.L.first]]]};

// Render the card to a 1080x1920 PNG and hand it to the native share sheet.
async function shareCard(R,C,btn){
  const W=1080,H=1920,cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
  x.fillStyle=C.bg; x.fillRect(0,0,W,H); x.fillStyle=C.fg;
  const serif='Iowan Old Style,Palatino,Georgia,serif', sans='-apple-system,Helvetica,Arial,sans-serif';
  x.font=`400 64px ${serif}`; x.fillText('mully.',80,150); x.font=`500 34px ${sans}`; x.globalAlpha=.75; x.textAlign='right'; x.fillText("STYLE GAME '26",W-80,140); x.textAlign='left'; x.globalAlpha=1;
  x.font=`500 34px ${sans}`; x.globalAlpha=.75; x.fillText(T('cardlbl').toUpperCase(),80,700); x.globalAlpha=1;
  const words=R.P.name.split(' '); let line='',y=820; x.font=`400 130px ${serif}`;
  for(const w of words){ const t=(line+' '+w).trim(); if(x.measureText(t).width>W-160&&line){x.fillText(line,80,y);y+=130;line=w;} else line=t; } x.fillText(line,80,y); y+=70;
  x.font=`400 44px ${sans}`; x.globalAlpha=.85; x.fillText(R.P.tag,80,y); x.globalAlpha=1; y+=70;
  AX.forEach((a,i)=>{ x.font=`500 26px ${sans}`; x.globalAlpha=.85; x.fillText(a.toUpperCase(),80,y+22); x.globalAlpha=.25; rr(x,260,y+8,W-160-180-100,16,8); x.fill(); x.globalAlpha=1; rr(x,260,y+8,(W-160-180-100)*R.pcts[i]/100,16,8); x.fill(); x.textAlign='right'; x.fillText(R.pcts[i]+'%',W-80,y+22); x.textAlign='left'; y+=44; }); y+=20;
  const bw=(W-160-40)/3; C.stats.forEach(([b,l],i)=>{ const sx=80+i*(bw+20); x.fillStyle=C.light?'rgba(20,24,22,.08)':'rgba(255,255,255,.16)'; rr(x,sx,y,bw,200,28); x.fill(); x.fillStyle=C.fg; x.font=`400 84px ${serif}`; x.fillText(b,sx+30,y+105); x.font=`500 28px ${sans}`; x.globalAlpha=.8; x.fillText(l.toUpperCase(),sx+30,y+160); x.globalAlpha=1; }); y+=270;
  x.font=`400 52px ${serif}`; x.fillText(C.sup,80,y); y+=70;
  const sw=(W-160-30)/4; R.P.pal.forEach((c,i)=>{ x.fillStyle=c; rr(x,80+i*(sw+10),y,sw,36,18); x.fill(); }); y+=90;
  x.fillStyle=C.fg; x.font=`500 34px ${sans}`; x.globalAlpha=.7; x.fillText('Find yours: mymully.com/stylegame',80,H-90); x.globalAlpha=1;
  const text=S.gift?`They're ${R.P.name}. 1 in ${C.oneIn} golfers.`:`I'm ${R.P.name}. 1 in ${C.oneIn} golfers. Find yours: The Style Game by Mully.`;
  try{ const blob=await new Promise(r=>cv.toBlob(r,'image/png')); const file=new File([blob],'my-golf-style.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})) await navigator.share({files:[file],text,title:'My golf style'});
    else if(navigator.share) await navigator.share({text,url:location.origin+location.pathname});
    else { const a=document.createElement('a'); a.href=cv.toDataURL('image/png'); a.download='my-golf-style.png'; a.click(); btn.textContent='✓'; }
  }catch(e){}
}
function rr(x,X,Y,w,h,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }
function insights(R){ const you=S.gift?'They':'You', your=S.gift?'their':'your';
  const z=S.colorZone==null?.5:S.colorZone, out=[];
  const pal=['Navy, white, charcoal. Nothing else.','Navy and forest, with sky as the reach.','Neutrals, plus one earned color per outfit.','Coral leads. Navy keeps it honest.','Full color. Confidence carries it.'][Math.round(z*4)];
  out.push(['Palette',pal]);
  out.push(['Fit',S.fit===1?'Slim. We size down on knits, never on pants.':S.fit===-1?'Relaxed. Drape matters more than shape.':'Regular. Classic proportion, room to swing.']);
  out.push(['Fabric',S.fabric<0?'Cotton and merino over tech.':S.fabric>0?'Performance fabric, as long as it looks like clothes.':'Fabric-agnostic. Hand feel decides.']);
  out.push(['Pattern',S.pattern<0?'Solids. Zero pattern.':S.pattern>0?`${you} will wear a print, if it is the right one.`:'Pattern in small doses.']);
  if(S.flags.team!==undefined){ const tm=MODEL.foursome.find(p=>p.ax===S.flags.team).n; out.push(['Company',`${tm} is your guy. ${S.flags.avoid} is not.`]); }
  if(S.flags.packed){ const p=S.flags.packed; const solo=p.some(x=>/book|headphones/.test(x)), social=p.some(x=>/speaker|cards|bourbon|cigars/.test(x)), train=p.some(x=>/running/.test(x));
    out.push(['Off course',train?`${you} train on trips. Pieces have to move.`:solo&&!social?'Solo time. Quiet pieces, nothing performative.':social?'The social one. Evening pieces matter.':'Low key. Function first.']); }
  return out;
}
function stylistValue(R){
  const brands=[...new Set(R.P.edit.map(e=>e[0]))].slice(0,2).join(' and ');

  return [`Build around ${R.P.pal[0]==='#1B2A47'?'navy':R.P.pal[0]==='#3A3D3B'?'charcoal':R.P.pal[0]==='#E8735A'?'coral':R.P.pal[0]==='#F2C94C'?'sun':'your lead color'} with one accent piece, never three.`,
    `Pull from ${brands}, the ${R.P.tag.split(',')[0].toLowerCase()} brands in our rotation.`,
    `Skip anything ${avoid.toLowerCase()}. ${S.gift?'The card':'You'} told us, without saying it.`,

  var lastShare = { blob: null, filename: null, caption: null, url: null };
  var started = false;
  var configured = false;
  var gameNames = ['split', 'assoc', 'color', 'foursome', 'fit', 'bag'];
  var utm = {};
  try {
    var params = new URLSearchParams(window.location.search);
    params.forEach(function (value, key) {
      if (key.indexOf('utm_') === 0 && value) utm[key] = value;
    });
  } catch (_) {}

  function cookie(name) {
    try {
      var prefix = name + '=';
      return document.cookie.split(';').map(function (part) { return part.trim(); }).filter(function (part) { return part.indexOf(prefix) === 0; }).map(function (part) { return decodeURIComponent(part.slice(prefix.length)); })[0] || null;
    } catch (_) { return null; }
  }

  var anonId = cookie('mully_anon_id');
  function eventProps(props) {
    var base = { funnel: 'stylegame', mully_anon_id: anonId || undefined };
    Object.keys(utm).forEach(function (key) { base[key] = utm[key]; });
    Object.keys(props || {}).forEach(function (key) { base[key] = props[key]; });
    return base;
  }

  function capture(name, props) {
    var payload = eventProps(props);
    try {
      if (window.posthog && typeof window.posthog.capture === 'function') {
        window.posthog.capture(name, payload);
        return;
      }
    } catch (_) {}
    console.info('[Style Game]', name, payload);
  }

  function gameState() {
    try { return typeof S === 'undefined' ? null : S; } catch (_) { return null; }
  }

  function gameFlow() {
    try { return typeof FLOW === 'undefined' ? null : FLOW; } catch (_) { return null; }
  }

  function loadPostHog() {
    var key = config.posthogKey;
    if (!key || key === 'PLACEHOLDER_WILL_BE_INJECTED_SERVERSIDE') return Promise.resolve(false);
    return new Promise(function (resolve) {
      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://unpkg.com/posthog-js@1.363.2/dist/array.js';
      script.onload = function () {
        try {
          window.posthog.init(key, {
            api_host: config.posthogHost || 'https://us.i.posthog.com',
            autocapture: false,
            capture_pageview: false,
          });
          if (anonId && typeof window.posthog.identify === 'function') {
            window.posthog.identify(anonId, { mully_anon_id: anonId });
          }
          if (typeof window.posthog.register === 'function') window.posthog.register(eventProps());
          configured = true;
        } catch (_) {}
        resolve(configured);
      };
      script.onerror = function () { resolve(false); };
      document.head.appendChild(script);
    });
  }

  function installHooks() {
    var originalGo = window.go;
    if (typeof originalGo === 'function') {
      window.go = function (name, isBack) {
        var state = gameState();
        var flow = gameFlow();
        var priorName = flow && state ? flow[state.step] : null;
        if (!isBack && !started && gameNames.indexOf(name) !== -1) {
          started = true;
          capture('sg_begin', { game: name, mode: state && state.gift ? 'gift' : 'self' });
        }
        if (!isBack && gameNames.indexOf(priorName) !== -1 && priorName !== name) {
          capture('sg_game_complete', { game: priorName, mode: state && state.gift ? 'gift' : 'self' });
        }
        if (!isBack && name === 'finale') capture('sg_finale', { mode: state && state.gift ? 'gift' : 'self' });
        if (!isBack && name === 'profile') capture('sg_card_view', { mode: state && state.gift ? 'gift' : 'self' });
        return originalGo.apply(this, arguments);
      };
    }

    document.addEventListener('click', function (event) {
      var target = event.target && event.target.closest ? event.target.closest('button') : null;
      if (!target) return;
      var state = gameState();
      if (target.id === 'giftbtn') capture('sg_gift_toggle', { mode: state && state.gift ? 'gift' : 'self' });
      if (target.getAttribute('aria-label') === 'Share') capture('sg_share_open', { mode: state && state.gift ? 'gift' : 'self' });
      if (target.classList.contains('hero') && target.classList.contains('btn')) capture('sg_cta_click', { mode: state && state.gift ? 'gift' : 'self' });
      if (target.closest('.gate') && !started) {
        started = true;
        capture('sg_begin', { game: 'split', mode: state && state.gift ? 'gift' : 'self' });
      }
    }, false);

    try { if (typeof MODEL !== 'undefined' && config.depositUrl) MODEL.depositUrl = config.depositUrl; } catch (_) {}

    // ---------- SHARE TARGETS (Phase 1b) ----------
    // Wrap the authored shareCard so we can offer X + Instagram Story + Native + Copy.
    // We do not touch the canvas render logic; we intercept the toBlob step by monkey-patching HTMLCanvasElement.toBlob only during our shareCard call.
    if (typeof window.shareCard === 'function') {
      var originalShareCard = window.shareCard;
      window.shareCard = async function (R, C, btn) {
        var state = gameState();
        var mode = state && state.gift ? 'gift' : 'self';
        var name = R && R.P && R.P.name ? R.P.name : 'my golf style';
        var oneIn = C && C.oneIn ? C.oneIn : '';
        var xHandle = config.xHandle || '@mymully';
        var igHandle = config.igHandle || '@mullyreserve';
        var siteUrl = config.ogUrl || (location.origin + location.pathname);
        // Two captions: X (short, with handle), IG (paste-ready with handle).
        var xText = state && state.gift
          ? "They're " + name + '. 1 in ' + oneIn + " golfers. Find yours \u2192 " + xHandle + "'s Style Game"
          : "I'm " + name + '. 1 in ' + oneIn + " golfers. Find yours \u2192 " + xHandle + "'s Style Game";
        var igText = state && state.gift
          ? "They're " + name + '. 1 in ' + oneIn + ' golfers. Find yours: ' + siteUrl + ' \u00b7 ' + igHandle
          : "I'm " + name + '. 1 in ' + oneIn + ' golfers. Find yours: ' + siteUrl + ' \u00b7 ' + igHandle;

        // Render once, cache blob for all share targets.
        var toBlob = HTMLCanvasElement.prototype.toBlob;
        var captured = null;
        HTMLCanvasElement.prototype.toBlob = function (cb, type, quality) {
          return toBlob.call(this, function (blob) {
            captured = blob;
            lastShare.blob = blob;
            lastShare.filename = 'my-golf-style.png';
            lastShare.caption = igText;
            lastShare.url = siteUrl;
            cb(blob);
          }, type, quality);
        };

        // Suppress the authored navigator.share call by temporarily shadowing it,
        // then invoke authored shareCard so the canvas paints and toBlob runs.
        var origCanShare = navigator.canShare;
        var origShare = navigator.share;
        navigator.canShare = function () { return false; };
        navigator.share = undefined;
        try {
          await originalShareCard.call(this, R, C, btn);
        } catch (_) {}
        navigator.canShare = origCanShare;
        navigator.share = origShare;
        HTMLCanvasElement.prototype.toBlob = toBlob;
        if (btn) btn.textContent = '\u21EA';

        openShareSheet({ mode: mode, xText: xText, igText: igText, siteUrl: siteUrl, xHandle: xHandle, igHandle: igHandle });
      };
    }
  }

  function openShareSheet(opts) {
    // Remove any prior sheet.
    var existing = document.getElementById('sg-share-sheet');
    if (existing) existing.remove();

    var sheet = document.createElement('div');
    sheet.id = 'sg-share-sheet';
    sheet.setAttribute('role', 'dialog');
    sheet.setAttribute('aria-modal', 'true');
    sheet.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:sg-fade .18s ease-out;';
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    var canNative = !!(navigator.share);
    var body = document.createElement('div');
    body.style.cssText = 'width:100%;max-width:520px;background:#faf7f2;color:#141816;border-top-left-radius:22px;border-top-right-radius:22px;padding:22px 20px 32px;font-family:-apple-system,Helvetica,Arial,sans-serif;box-shadow:0 -12px 40px rgba(0,0,0,.25);';
    body.innerHTML = '<div style="width:44px;height:5px;background:rgba(20,24,22,.18);border-radius:3px;margin:0 auto 18px;"></div>' +
      '<div style="font:500 20px/1.2 Iowan Old Style,Palatino,Georgia,serif;text-align:center;margin-bottom:4px;">Share your card</div>' +
      '<div style="font:400 13px/1.35 -apple-system,Helvetica,Arial,sans-serif;text-align:center;opacity:.65;margin-bottom:22px;">' + opts.xHandle + ' + ' + opts.igHandle + ' get tagged automatically</div>' +
      '<div id="sg-share-targets" style="display:flex;flex-direction:column;gap:10px;"></div>' +
      '<button id="sg-share-cancel" style="width:100%;margin-top:14px;padding:14px;background:transparent;border:0;font:500 15px -apple-system,Helvetica,Arial,sans-serif;color:rgba(20,24,22,.55);cursor:pointer;">Cancel</button>';
    sheet.appendChild(body);
    document.body.appendChild(sheet);

    // Inject keyframes once.
    if (!document.getElementById('sg-share-css')) {
      var st = document.createElement('style');
      st.id = 'sg-share-css';
      st.textContent = '@keyframes sg-fade{from{opacity:0}to{opacity:1}}#sg-share-sheet button.sg-target{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;background:#fff;border:1px solid rgba(20,24,22,.08);border-radius:14px;font:500 16px -apple-system,Helvetica,Arial,sans-serif;color:#141816;cursor:pointer;text-align:left;transition:transform .12s ease,background .12s ease;}#sg-share-sheet button.sg-target:hover{background:#f2ede4;transform:translateY(-1px);}#sg-share-sheet .sg-ico{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:#141816;color:#faf7f2;border-radius:8px;font-weight:700;font-size:15px;}#sg-share-sheet .sg-sub{display:block;font-weight:400;font-size:12px;opacity:.6;margin-top:2px;}';
      document.head.appendChild(st);
    }

    var targets = body.querySelector('#sg-share-targets');
    function addTarget(icon, label, sub, onClick, kind) {
      var b = document.createElement('button');
      b.className = 'sg-target';
      b.innerHTML = '<span class="sg-ico">' + icon + '</span><span><span>' + label + '</span><span class="sg-sub">' + sub + '</span></span>';
      b.onclick = function () {
        capture('sg_share_target', { target: kind, mode: opts.mode });
        onClick();
      };
      targets.appendChild(b);
    }

    // X — always works. Pre-filled tweet with @mymully tag.
    addTarget('X', 'Post to X', 'Auto-tags ' + opts.xHandle, function () {
      var url = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(opts.xText) + '&url=' + encodeURIComponent(opts.siteUrl);
      window.open(url, '_blank', 'noopener,noreferrer,width=550,height=680');
      closeShareSheet();
    }, 'x');

    // Instagram Story — mobile only.
    if (isMobile) {
      addTarget('IG', 'Share to Instagram Story', 'Tag ' + opts.igHandle + ' after \u2014 caption copied', function () {
        shareToInstagramStory(opts);
      }, 'instagram_story');
    }

    // Native share sheet (mobile) or Copy caption fallback (desktop).
    if (canNative) {
      addTarget('\u2925', 'More apps\u2026', 'Native share sheet', function () {
        nativeShareBlob(opts.igText);
      }, 'native');
    }
    addTarget('\u2398', 'Copy caption', 'For manual Instagram/Facebook posts', function () {
      copyToClipboard(opts.igText).then(function () {
        toast('Caption copied. Save the image if you need it.');
        // Also trigger a download in case they lost the render.
        downloadBlob();
      });
      closeShareSheet();
    }, 'copy_caption');

    document.getElementById('sg-share-cancel').onclick = closeShareSheet;
    sheet.addEventListener('click', function (e) { if (e.target === sheet) closeShareSheet(); });
  }

  function closeShareSheet() {
    var el = document.getElementById('sg-share-sheet');
    if (el) el.remove();
  }

  function toast(msg) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#141816;color:#faf7f2;padding:12px 18px;border-radius:22px;font:500 14px -apple-system,Helvetica,Arial,sans-serif;z-index:100000;box-shadow:0 10px 30px rgba(0,0,0,.35);';
    document.body.appendChild(t);
    setTimeout(function () { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; }, 2200);
    setTimeout(function () { t.remove(); }, 2600);
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      ta.remove();
      resolve();
    });
  }

  function downloadBlob() {
    if (!lastShare.blob) return;
    var url = URL.createObjectURL(lastShare.blob);
    var a = document.createElement('a');
    a.href = url; a.download = lastShare.filename || 'my-golf-style.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function nativeShareBlob(text) {
    if (!lastShare.blob || !navigator.share) { closeShareSheet(); return; }
    var file = new File([lastShare.blob], lastShare.filename || 'my-golf-style.png', { type: 'image/png' });
    var payload = { text: text, title: 'My golf style' };
    if (navigator.canShare && navigator.canShare({ files: [file] })) payload.files = [file];
    navigator.share(payload).catch(function () {}).finally(closeShareSheet);
  }

  function shareToInstagramStory(opts) {
    // Copy caption first so they can paste as sticker after IG opens.
    copyToClipboard(opts.igText);
    downloadBlob();
    // Attempt deep link. iOS supports instagram-stories:// with pasteboard-based background sharing;
    // Android supports com.instagram.share.ADD_TO_STORY intent. Neither can pre-fill a mention sticker \u2014 that's a hard IG platform limit.
    // Simplest reliable path across both: open the IG app, user long-presses to paste image, adds mention manually.
    // We use a two-step approach: try the deep link, and after 1200ms fall back to a toast with instructions.
    var opened = false;
    var startedAt = Date.now();
    function fallback() {
      if (opened) return;
      opened = true;
      toast('Image saved + caption copied. Open Instagram \u2192 Story \u2192 add photo \u2192 tag ' + opts.igHandle);
      closeShareSheet();
    }
    // Trigger deep link.
    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    try {
      var link = isIOS ? 'instagram://story-camera' : 'intent://story-camera#Intent;package=com.instagram.android;scheme=instagram;end';
      window.location.href = link;
    } catch (_) {}
    // If we're still visible after 1.2s the app didn't open \u2014 show manual instructions.
    setTimeout(function () {
      if (document.visibilityState === 'visible' && Date.now() - startedAt < 3000) fallback();
      else fallback();
    }, 1200);
  }

  function start() {
    config = window.MULLY_STYLEGAME_CONFIG || config;
    loadPostHog().then(function () {
      installHooks();
      capture('sg_view', { analytics_configured: configured });
    });
  }

  if (document.readyState === 'complete') start();
  else window.addEventListener('load', start, { once: true });
}());
</script>
</body>
</html>
