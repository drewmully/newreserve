name: Deploy Mully Internal Extensions

# Ships the Shopify app extensions in shopify-extensions/mully-reassurance
# (checkout reassurance, Mully Access post-purchase offer, Mully Access cart
# discount) to the "Mully Internal Extensions" app. Manual trigger only.
# Requires repo secret SHOPIFY_CLI_PARTNERS_TOKEN (Partner Dashboard >
# Settings > CLI token).

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Version message"
        required: false
        default: "Deploy from GitHub Actions"

permissions:
  contents: read

concurrency:
  group: shopify-extensions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopify-extensions/mully-reassurance
    env:
      SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
      SHOPIFY_CLI_NO_ANALYTICS: "1"
      CLIENT_ID: 47d5739bdadce8acae4a9ee0962339d4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check token
        run: test -n "$SHOPIFY_CLI_PARTNERS_TOKEN" || { echo "Add the SHOPIFY_CLI_PARTNERS_TOKEN repo secret"; exit 1; }
      - run: npm install --no-audit --no-fund
      - name: Fetch function schema
        run: npx shopify app function schema --path extensions/mully-access-cart-discount --client-id "$CLIENT_ID"
      - name: Deploy
        run: npx shopify app deploy --allow-updates --client-id "$CLIENT_ID" --message "${{ github.event.inputs.message }}"
