name: Bounded production analytics dispatch

# Review-ready only. Merging installs these trigger definitions, so merge itself
# requires schedule approval. Jobs remain off unless BOTH repository variables
# below are explicitly true. No pull-request event can access the runner secret.
on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: read

concurrency:
  group: mymully-production-analytics-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'drewmully/newreserve' &&
      github.ref == 'refs/heads/main' &&
      vars.LEAN_ANALYTICS_SCHEDULE_ENABLED == 'true' &&
      vars.LEAN_ANALYTICS_DISPATCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.1"
      - name: Advance one saved receipt and check counts-only health
        env:
          LEAN_ANALYTICS_SCHEDULE_ENABLED: ${{ vars.LEAN_ANALYTICS_SCHEDULE_ENABLED }}
          LEAN_ANALYTICS_DISPATCH_ENABLED: ${{ vars.LEAN_ANALYTICS_DISPATCH_ENABLED }}
          LEAN_ANALYTICS_SCHEDULE_MODE: ${{ vars.LEAN_ANALYTICS_SCHEDULE_MODE }}
          LEAN_ANALYTICS_SCHEDULE_START_AT: ${{ vars.LEAN_ANALYTICS_SCHEDULE_START_AT }}
          LEAN_ANALYTICS_SCHEDULE_STOP_AT: ${{ vars.LEAN_ANALYTICS_SCHEDULE_STOP_AT }}
          LEAN_ANALYTICS_RUNNER_ORIGIN: https://www.mymully.com
          LEAN_ANALYTICS_PIPELINE_PROJECT_REF: xnfjdbpjuaezxjgargto
          LEAN_ANALYTICS_SUPABASE_URL: https://xnfjdbpjuaezxjgargto.supabase.co
          LEAN_ANALYTICS_PIPELINE_SECRET: ${{ secrets.LEAN_ANALYTICS_PIPELINE_SECRET }}
        run: node scripts/analytics/scheduled-pipeline.mjs
  subscriptions:
    # Independent from commerce. DB048/049 owns the approved plan and source budget.
    if: >-
      github.repository == 'drewmully/newreserve' &&
      github.ref == 'refs/heads/main' &&
      vars.LEAN_SUBSCRIPTIONS_SCHEDULE_ENABLED == 'true' &&
      vars.LEAN_SUBSCRIPTIONS_DISPATCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.1"
      - name: Advance one approved subscription page without retries
        env:
          LEAN_SUBSCRIPTIONS_SCHEDULE_ENABLED: ${{ vars.LEAN_SUBSCRIPTIONS_SCHEDULE_ENABLED }}
          LEAN_SUBSCRIPTIONS_DISPATCH_ENABLED: ${{ vars.LEAN_SUBSCRIPTIONS_DISPATCH_ENABLED }}
          LEAN_SUBSCRIPTIONS_SCHEDULE_START_AT: ${{ vars.LEAN_SUBSCRIPTIONS_SCHEDULE_START_AT }}
          LEAN_SUBSCRIPTIONS_SCHEDULE_STOP_AT: ${{ vars.LEAN_SUBSCRIPTIONS_SCHEDULE_STOP_AT }}
          LEAN_ANALYTICS_RUNNER_ORIGIN: https://www.mymully.com
          LEAN_ANALYTICS_PIPELINE_PROJECT_REF: xnfjdbpjuaezxjgargto
          LEAN_ANALYTICS_SUBSCRIPTIONS_SECRET: ${{ secrets.LEAN_ANALYTICS_SUBSCRIPTIONS_SECRET }}
        run: node scripts/analytics/scheduled-subscriptions.mjs
