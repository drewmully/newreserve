name: Analytics contracts

on:
  pull_request:
    paths:
      - "src/lib/analytics/**"
      - "src/app/api/_lib/supabaseService.ts"
      - "src/app/api/analytics/ingest/**"
      - "tests/api/analytics*.test.ts"
      - "sql/analytics/**"
      - "scripts/analytics/**"
      - "docs/analytics/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "tsconfig.analytics.json"
      - "eslint.config.mjs"
      - "tests/setup/api.setup.ts"
      - ".github/workflows/analytics-contracts.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/analytics/**"
      - "src/app/api/_lib/supabaseService.ts"
      - "src/app/api/analytics/ingest/**"
      - "tests/api/analytics*.test.ts"
      - "sql/analytics/**"
      - "scripts/analytics/**"
      - "docs/analytics/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "tsconfig.analytics.json"
      - "eslint.config.mjs"
      - "tests/setup/api.setup.ts"
      - ".github/workflows/analytics-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fixture_owner
          POSTGRES_PASSWORD: fixture_local_only
          POSTGRES_DB: analytics_test_pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture_owner -d analytics_test_pipeline"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LOCAL_POSTGRES_TEST_URL: postgresql://fixture_owner:fixture_local_only@127.0.0.1:5432/analytics_test_pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.1"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify generated schema files match their checked-in contracts
        run: |
          node scripts/analytics/generate-staging.mjs
          node scripts/analytics/generate-reporting-sql.mjs
          git diff --exit-code -- sql/analytics/001_staging.sql sql/analytics/014_reporting_views.sql
      - run: npm test -- --project api tests/api/analyticsContracts.test.ts tests/api/analyticsLean
      - run: npx tsc --project tsconfig.analytics.json
      - run: npx eslint src/lib/analytics src/app/api/analytics/ingest src/app/api/_lib/supabaseService.ts tests/api/analyticsContracts.test.ts tests/api/analyticsLean*.test.ts scripts/analytics/*.mjs
