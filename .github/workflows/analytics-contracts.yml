name: Analytics contracts

on:
  pull_request:
    paths:
      - "src/lib/analytics/**"
      - "src/app/api/_lib/supabaseService.ts"
      - "src/app/api/_lib/googleAuth.ts"
      - "src/app/api/analytics/ingest/**"
      - "src/app/api/analytics/journey/**"
      - "src/app/api/analytics/track/route.ts"
      - "src/app/api/shopify/checkout/route.ts"
      - "src/app/api/stylegame/**"
      - "src/app/api/simulatorclubs/checkout/route.ts"
      - "src/app/lp/stylegame/runtime-config.js/route.ts"
      - "src/app/analytics-preferences/**"
      - "src/app/text-mully/page.tsx"
      - "src/app/policies/layout.tsx"
      - "src/lib/shopify.ts"
      - "src/lib/shopifyCheckout.ts"
      - "src/lib/swingBoxCheckout.ts"
      - "public/lp/stylegame/index.html"
      - "tests/api/analytics*.test.ts"
      - "tests/fixtures/analyticsFull.ts"
      - "tests/fixtures/analyticsSpendPilot.ts"
      - "tests/fixtures/analytics*.ts"
      - "tests/fixtures/*.mjs"
      - "sql/analytics/**"
      - "scripts/analytics/**"
      - "docs/analytics/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "tsconfig.analytics.json"
      - "eslint.config.mjs"
      - "vercel.json"
      - "tests/setup/api.setup.ts"
      - ".github/workflows/analytics-contracts.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/analytics/**"
      - "src/app/api/_lib/supabaseService.ts"
      - "src/app/api/_lib/googleAuth.ts"
      - "src/app/api/analytics/ingest/**"
      - "src/app/api/analytics/journey/**"
      - "src/app/api/analytics/track/route.ts"
      - "src/app/api/shopify/checkout/route.ts"
      - "src/app/api/stylegame/**"
      - "src/app/api/simulatorclubs/checkout/route.ts"
      - "src/app/lp/stylegame/runtime-config.js/route.ts"
      - "src/app/analytics-preferences/**"
      - "src/app/text-mully/page.tsx"
      - "src/app/policies/layout.tsx"
      - "src/lib/shopify.ts"
      - "src/lib/shopifyCheckout.ts"
      - "src/lib/swingBoxCheckout.ts"
      - "public/lp/stylegame/index.html"
      - "tests/api/analytics*.test.ts"
      - "tests/fixtures/analyticsFull.ts"
      - "tests/fixtures/analyticsSpendPilot.ts"
      - "tests/fixtures/analytics*.ts"
      - "tests/fixtures/*.mjs"
      - "sql/analytics/**"
      - "scripts/analytics/**"
      - "docs/analytics/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "tsconfig.analytics.json"
      - "eslint.config.mjs"
      - "vercel.json"
      - "tests/setup/api.setup.ts"
      - ".github/workflows/analytics-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fixture_owner
          POSTGRES_PASSWORD: fixture_local_only
          POSTGRES_DB: analytics_test_pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture_owner -d analytics_test_pipeline"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LOCAL_POSTGRES_TEST_URL: postgresql://fixture_owner:fixture_local_only@127.0.0.1:5432/analytics_test_pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.1"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify generated schema files match their checked-in contracts
        run: |
          node scripts/analytics/generate-staging.mjs
          node scripts/analytics/generate-reporting-sql.mjs
          git diff --exit-code -- sql/analytics/001_staging.sql sql/analytics/014_reporting_views.sql
      - name: Run analytics and real PostgreSQL contracts in both timezones
        run: |
          for zone in UTC America/Los_Angeles; do
            TZ="$zone" npm test -- --project api --maxWorkers 2 \
              tests/api/analyticsContracts.test.ts tests/api/analyticsLean*.test.ts tests/api/analyticsTrack.route.test.ts \
              --exclude tests/api/analyticsLeanHistoryBridge.test.ts
          done
      - run: npx tsc --project tsconfig.analytics.json
      - name: Verify late-install compatibility on disposable PostgreSQL without concurrent role resets
        env:
          LEAN_LATE_INSTALL_POSTGRES: "true"
        run: npm test -- --project api --maxWorkers 1 tests/api/analyticsLeanLateInstall.test.ts
      - name: Verify combined private history bridge on disposable PostgreSQL without concurrent role resets
        env:
          HISTORY_BRIDGE_TEST_URL: ${{ env.LOCAL_POSTGRES_TEST_URL }}
        run: npm test -- --project api --maxWorkers 1 tests/api/analyticsLeanHistoryBridge.test.ts
      - run: npx eslint src/lib/analytics src/app/api/analytics/ingest src/app/api/_lib/supabaseService.ts src/app/api/_lib/googleAuth.ts tests/api/analyticsContracts.test.ts tests/api/analyticsLean*.test.ts tests/fixtures/analyticsFull.ts tests/fixtures/analyticsSpendPilot.ts scripts/analytics/*.mjs
      - name: Lint integrated source fixtures and guarded application hooks
        run: npx eslint src/app/api/analytics/journey tests/fixtures/analytics*.ts tests/fixtures/*.mjs src/app/api/analytics/track/route.ts src/app/api/stylegame/checkout/route.ts src/app/api/stylegame/played/route.ts src/app/api/simulatorclubs/checkout/route.ts src/app/lp/stylegame/runtime-config.js/route.ts src/lib/shopify.ts src/lib/shopifyCheckout.ts src/lib/swingBoxCheckout.ts src/app/api/shopify/checkout/route.ts src/app/analytics-preferences/page.tsx src/app/text-mully/page.tsx src/app/policies/layout.tsx
